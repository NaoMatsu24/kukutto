<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffd72e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="くくっと！">
  <title>くくっと！｜1日10問の九九チャレンジ</title>
  <link rel="icon" type="image/png" href="images/icons/app-icon-192.png">
  <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <button class="brand" data-page="home" aria-label="ホームへ"><img src="images/character/penguin-happy-face.png" alt="">くくっと！</button>
    <nav aria-label="メインメニュー">
      <button data-page="test">テストする</button>
      <button data-page="records"><ruby>記録<rt>きろく</rt></ruby>を見る</button>
      <button data-page="weak"><ruby>苦手<rt>にがて</rt></ruby>な九九</button>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <aside id="install-prompt" class="install-prompt" role="dialog" aria-labelledby="install-prompt-title" aria-describedby="install-prompt-message" hidden>
    <img src="images/character/penguin-happy-face.png" alt="" class="install-prompt-character">
    <div class="install-prompt-copy">
      <strong id="install-prompt-title">アプリとして使いますか？</strong>
      <span id="install-prompt-message">ホーム画面に追加すると、次からすぐに開けます。</span>
    </div>
    <div class="install-prompt-actions">
      <button id="install-app" class="button green" type="button">アプリを追加</button>
      <button id="close-install-prompt" class="button light" type="button" aria-label="インストール案内を閉じる">今はしない</button>
    </div>
  </aside>

  <aside id="update-prompt" class="install-prompt update-prompt" role="dialog" aria-labelledby="update-prompt-title" aria-describedby="update-prompt-message" hidden>
    <img src="images/character/penguin-celebrate-full.png" alt="" class="install-prompt-character">
    <div class="install-prompt-copy">
      <strong id="update-prompt-title">新しいアップデートがあります</strong>
      <span id="update-prompt-message">最新版にすると、もっと使いやすくなります。</span>
    </div>
    <div class="install-prompt-actions">
      <button id="apply-update" class="button green" type="button">今すぐ更新</button>
      <button id="close-update-prompt" class="button light" type="button">あとで</button>
    </div>
  </aside>

  <footer>
    <img class="footer-character" src="images/character/penguin-happy-face.png" alt="笑顔のペンギン">
    <span><span class="footer-slogan">毎日ちょっとずつ、楽しくチャレンジ！</span><small>© 2026 Taro.M. All Rights Reserved.</small></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
